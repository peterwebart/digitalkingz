# Local development database only.
#
# This is NOT your production database. Production Postgres is a Coolify
# resource on your Hetzner server and is never defined here.
#
#   pnpm db:up      start it
#   pnpm db:down    stop it (data is kept)
#   pnpm db:reset   destroy it and start clean
#
# Requires Docker Desktop to be running.

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalkingz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitalkingz
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: digitalkingz
    ports:
      # Host port 5433 on purpose: it will not collide with any Postgres you
      # already have installed on 5432.
      - '5433:5432'
    volumes:
      - digitalkingz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digitalkingz -d digitalkingz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  digitalkingz-pgdata:
